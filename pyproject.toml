[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "customer-risk-workbench"
version = "0.1.0"
description = "Reproducible customer risk research, scoring, scenario testing, and model validation with synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Max Moran"}]
dependencies = []

[project.urls]
Repository = "https://github.com/maxmoran23/customer-risk-workbench"
Documentation = "https://github.com/maxmoran23/customer-risk-workbench/tree/main/docs"
Issues = "https://github.com/maxmoran23/customer-risk-workbench/issues"

[project.optional-dependencies]
research = ["numpy>=2.1,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
crw = "crw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
