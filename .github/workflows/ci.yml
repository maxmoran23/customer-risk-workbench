name: Reproduce reference evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,research]'
      - run: python -m ruff check src tests scripts examples
      - run: python scripts/source_manifest.py --check
      - run: python -m pytest --cov=crw --cov-report=term-missing
      - run: python -m crw scenarios --out runs/scenarios.json
      - run: python scripts/build_scenario_catalog.py --check
      - run: python scripts/build_program_configs.py --check
      - run: python examples/build_program_examples.py --check
      - run: python scripts/public_boundary_check.py
      - run: python scripts/check_numerics.py --out runs/numerical-crosscheck.json
      - run: python examples/walkthrough.py --out runs/example-walkthrough.json
      - run: python -m crw demo --customers 120 --transactions 80 --research --research-rows 1000 --out runs/ci-demo
      - run: python -m crw program-demo --parties 5000 --out runs/ci-program-demo
      - run: python -m build
      - run: python scripts/check_wheel.py --out runs/wheel-check.json
